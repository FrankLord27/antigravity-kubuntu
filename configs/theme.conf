# =============================================================================
#  AUTO SETUP — configs/theme.conf
#  Tema «Arcade Tokyo» (módulo 14): escritorio retro de 8 bits con colores Tokyo Night.
# =============================================================================

INSTALL_THEME=true              # false: el módulo 14 no hace nada

# Clima del HUD (open-meteo.com, sin cuenta ni clave). Coordenadas en grados decimales.
THEME_CITY="La Vega"
THEME_LAT="19.2221"
THEME_LON="-70.5296"

# true: borra los paneles de Plasma que haya y crea la barra superior y el dock arcade.
# false: deja tus paneles como están y solo añade el HUD y el fondo animado.
THEME_REPLACE_PANELS=true

# Pantalla de arranque con marcianos (Plymouth). Reconstruye el initramfs y actualiza GRUB.
THEME_BOOT_SPLASH=true

# Pantalla de login (SDDM) con el mismo estilo. Reemplaza el tema de login actual; quitarlo:
# sudo bash theme/instalar_login.sh --quitar <usuario>
THEME_LOGIN=true

# Sonidos al abrir, cerrar, minimizar y maximizar ventanas.
THEME_WINDOW_SOUNDS=true

# Visualizador de audio del HUD: deja `cava` corriendo en segundo plano (≈6 % de un núcleo con audio).
THEME_AUDIO_VISUALIZER=true

# Paquetes que necesita el tema.
PKGS_THEME=(git curl unzip ffmpeg python3-pil fontconfig x11-apps cava pipewire-bin
            qdbus-qt6 kpackagetool6 libkf6config-bin
            libqt6multimedia6 qml6-module-qtmultimedia gstreamer1.0-libav
            qml6-module-org-kde-ksysguard plymouth plymouth-themes)

# Descargas fijadas a una versión concreta (y a su suma SHA-256 donde hay un archivo único).
THEME_VIDEO_PLUGIN_REPO="https://github.com/luisbocanegra/plasma-smart-video-wallpaper-reborn.git"
THEME_VIDEO_PLUGIN_REF="v2.17.0"
THEME_ICONS_REPO="https://github.com/ItzSelenux/pixelitos-icon-theme.git"
THEME_ICONS_REF="b31fefc71e52defdfdab3b9fb996fc6d6d6300f7"
THEME_FONT_PIXEL_URL="https://github.com/google/fonts/raw/5bb28733cec313b63fbd415b574b5ae35c8aa8b8/ofl/pressstart2p/PressStart2P-Regular.ttf"
THEME_FONT_PIXEL_SHA256="034c77f1f05ec89421e4a63f0e3a4ca1ecf852cc6d2bf611f126f275728e017d"
THEME_FONT_TERM_URL="https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/DepartureMono.zip"
THEME_FONT_TERM_SHA256="a49e33d74093541c26f48cfb94f3db7bcf9f4d6c975cb0de34dd3a25bb4e4993"
