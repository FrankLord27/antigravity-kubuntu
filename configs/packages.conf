#!/usr/bin/env bash
# =============================================================================
#  AUTO SETUP — configs/packages.conf  [Debian 13 / Ubuntu 26.04]
#  Comenta con # cualquier línea que ya no quieras instalar.
# =============================================================================

# ─── NVIDIA (solo se usa si hay GPU NVIDIA) ─────────────────────────────────
# DEBIAN: de dónde sale el driver.
#   nvidia-repo → repo apt oficial de NVIDIA para Debian, fijado en una rama.
#   debian      → paquete nvidia-driver de Debian (550, sin mantenimiento pero muy probado).
NVIDIA_SOURCE="nvidia-repo"
NVIDIA_BRANCH="610"                     # rama fijada (590, 595, 610, 615, 620). La 610 es la última con módulo propietario.
NVIDIA_FLAVOR="proprietary"             # proprietary | open  (desde la 615 solo existe open)
NVIDIA_DISABLE_GSP=true                 # solo con proprietary: evita el stutter en Turing (GTX 16xx) con KDE

# UBUNTU: rama del PPA/repos de Ubuntu.
NVIDIA_DRIVER_VERSION="580"
NVIDIA_DRIVER_VARIANT="$NVIDIA_FLAVOR"
[[ "$NVIDIA_DRIVER_VARIANT" == "open" ]] && NVIDIA_PKG_SUFFIX="-open" || NVIDIA_PKG_SUFFIX=""
NVIDIA_DRIVER_PKG="nvidia-driver-${NVIDIA_DRIVER_VERSION}${NVIDIA_PKG_SUFFIX}"
CUDA_VERSION="12-8"

# ─── Firmware (Debian). Juego completo: sirve para cualquier PC o adaptador ──
PKGS_FIRMWARE_DEBIAN=(
    firmware-linux              # meta: firmware libre + no libre básico
    firmware-misc-nonfree       # de todo un poco (incluye chips de red y video)
    firmware-realtek            # red y Wi-Fi/Bluetooth Realtek (lo más común en placas de escritorio)
    firmware-iwlwifi            # Wi-Fi/Bluetooth Intel
    firmware-atheros            # Wi-Fi/Bluetooth Qualcomm Atheros
    firmware-mediatek           # Wi-Fi/Bluetooth MediaTek (adaptadores USB modernos)
    firmware-brcm80211          # Wi-Fi Broadcom
    firmware-libertas           # Wi-Fi Marvell
    firmware-ath9k-htc          # adaptadores USB Atheros antiguos
    firmware-intel-graphics     # gráficas Intel
    firmware-intel-misc         # otros chips Intel
    firmware-amd-graphics       # gráficas AMD
    firmware-sof-signed         # sonido en laptops modernas (Intel SOF)
    firmware-intel-sound        # sonido Intel antiguo
    bluez-firmware              # Bluetooth Broadcom
)

# ─── Escritorio KDE ──────────────────────────────────────────────────────────
# Solo si Debian se instaló SIN escritorio:
PKGS_KDE_BASE=(
    kde-plasma-desktop sddm network-manager plasma-nm plasma-pa
    konsole dolphin kate ark kde-spectacle gwenview okular kcalc plasma-systemmonitor
    xorg firefox-esr
)
# Siempre (aunque hayas marcado KDE en el instalador):
PKGS_KDE_EXTRA=(
    kwin-x11                    # sesión X11 de respaldo en la pantalla de login
    kwin-wayland sddm-theme-breeze kde-config-sddm
    kde-config-gtk-style breeze-gtk-theme   # que las apps GTK no se vean feas
    xdg-desktop-portal-kde plasma-browser-integration
    bluedevil powerdevil kscreen plasma-firewall plasma-disks partitionmanager
    kio-extras ffmpegthumbs kdegraphics-thumbnailers kdeconnect kwalletmanager
    power-profiles-daemon
)
PKGS_AUDIO_BT=(pipewire-audio wireplumber pipewire-pulse pipewire-alsa pipewire-jack
               libspa-0.2-bluetooth pavucontrol-qt alsa-utils bluez)
PKGS_CODECS=(ffmpeg libavcodec-extra gstreamer1.0-plugins-base gstreamer1.0-plugins-good
             gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
             gstreamer1.0-pipewire vainfo mesa-utils vulkan-tools)
PKGS_FONTS=(fonts-noto fonts-noto-color-emoji fonts-noto-cjk fonts-liberation2 fonts-dejavu
            fonts-jetbrains-mono fonts-firacode fonts-inter)
PKGS_DESKTOP_UTILS=(ntfs-3g exfatprogs dosfstools 7zip unrar-free zip unzip
                    wl-clipboard xclip rsync timeshift)
PKGS_SPANISH=(task-spanish task-spanish-desktop task-spanish-kde-desktop hunspell-es)

# ─── Impresoras y escáner ────────────────────────────────────────────────────
PKGS_PRINTING=(cups cups-browsed printer-driver-all hplip ipp-usb avahi-daemon
               print-manager sane-airscan sane-utils skanlite)

# ─── Claude Code + ai-lordkit ────────────────────────────────────────────────
INSTALL_AI_LORDKIT=true
AI_LORDKIT_REPO="https://github.com/FrankLord27/ai-lordkit.git"
AI_LORDKIT_REF="main"                   # rama, tag o SHA

# ─── Node ────────────────────────────────────────────────────────────────────
NVM_VERSION="v0.41.0"
NODE_VERSION="26"

# ─── Agentes de IA (npm global, con el Node de nvm) ─────────────────────────
# Claude Code NO va aquí: lo instala ai-lordkit con el instalador oficial (módulo 13).
NPM_GLOBAL_PKGS=(
    "@openai/codex"                 # Codex CLI
    "@google/gemini-cli"            # Gemini CLI
)

# ─── Orca — panel de escritorio para gestionar los agentes de IA ────────────
INSTALL_ORCA=true
ORCA_RELEASES_API="https://api.github.com/repos/stablyai/orca/releases/latest"

# ─── Navegador ───────────────────────────────────────────────────────────────
INSTALL_CHROME=true

# ─── apt — repos estándar (Debian y Ubuntu) ──────────────────────────────────
PKGS_APPS_EXTRA=(
    gimp                # edición de imágenes
    obs-studio          # grabación/streaming
    krita               # dibujo digital
    blender             # 3D
    thunderbird         # correo
    discord             # (Ubuntu: no existe en apt → cae a flatpak)
    httpie              # cliente HTTP de terminal
    fritzing            # diseño electrónico
    librepcb            # diseño PCB
    samba               # compartir archivos en red
    gsmartcontrol       # salud de discos (SMART)
    gddrescue           # rescate de datos
    krename             # renombrado masivo
    filelight           # uso de disco visual
    mpv                 # reproductor
    vlc                 # reproductor
    remmina             # escritorio remoto
)

# apt — requieren repo/descarga de terceros (los configura el módulo 12)
INSTALL_ANYDESK=true        # repo oficial deb.anydesk.com
INSTALL_TEAMVIEWER=true     # .deb oficial de teamviewer.com

# flatpak — lo que no está en apt o se prefiere sandboxed
FLATPAK_APPS=(
    "com.discordapp.Discord"            # Discord (si no vino por apt)
    "im.riot.Riot"                      # Element
    "net.davidotek.pupgui2"             # ProtonUp-Qt
    "com.heroicgameslauncher.hgl"       # Heroic Games Launcher
)
