#!/usr/bin/env bash
# =============================================================================
#  AUTO SETUP — configs/packages.conf  [Debian 13 / Ubuntu 26.04]
#  Comenta con # cualquier línea que ya no quieras instalar.
# =============================================================================

# ─── NVIDIA (solo se usa si hay GPU NVIDIA; en Debian se usa el paquete
#     "nvidia-driver" del repo non-free, estas variables aplican a Ubuntu) ────
NVIDIA_DRIVER_VERSION="580"
NVIDIA_DRIVER_VARIANT="proprietary"     # proprietary | open
NVIDIA_DISABLE_GSP=true                 # solo con proprietary
[[ "$NVIDIA_DRIVER_VARIANT" == "open" ]] && NVIDIA_PKG_SUFFIX="-open" || NVIDIA_PKG_SUFFIX=""
NVIDIA_DRIVER_PKG="nvidia-driver-${NVIDIA_DRIVER_VERSION}${NVIDIA_PKG_SUFFIX}"
CUDA_VERSION="12-8"

# ─── Node ────────────────────────────────────────────────────────────────────
NVM_VERSION="v0.41.0"
NODE_VERSION="26"

# ─── Agentes de IA (npm global, con el Node de nvm) ─────────────────────────
NPM_GLOBAL_PKGS=(
    "@anthropic-ai/claude-code"     # Claude Code
    "@openai/codex"                 # Codex CLI
    "@google/gemini-cli"            # Gemini CLI
)

# ─── Orca — panel de escritorio para gestionar los agentes de IA ────────────
INSTALL_ORCA=true
ORCA_RELEASES_API="https://api.github.com/repos/stablyai/orca/releases/latest"

# ─── Navegador ───────────────────────────────────────────────────────────────
INSTALL_CHROME=true

# ─── apt — repos estándar (Debian y Ubuntu) ──────────────────────────────────
PKGS_APPS_EXTRA=(
    gimp                # edición de imágenes
    obs-studio          # grabación/streaming
    krita               # dibujo digital
    blender             # 3D
    thunderbird         # correo
    discord             # (Ubuntu: no existe en apt → cae a flatpak)
    httpie              # cliente HTTP de terminal
    fritzing            # diseño electrónico
    librepcb            # diseño PCB
    samba               # compartir archivos en red
    gsmartcontrol       # salud de discos (SMART)
    gddrescue           # rescate de datos
    krename             # renombrado masivo
    filelight           # uso de disco visual
    mpv                 # reproductor
    vlc                 # reproductor
    remmina             # escritorio remoto
)

# apt — requieren repo/descarga de terceros (los configura el módulo 12)
INSTALL_ANYDESK=true        # repo oficial deb.anydesk.com
INSTALL_TEAMVIEWER=true     # .deb oficial de teamviewer.com

# flatpak — lo que no está en apt o se prefiere sandboxed
FLATPAK_APPS=(
    "com.discordapp.Discord"            # Discord (si no vino por apt)
    "im.riot.Riot"                      # Element
    "net.davidotek.pupgui2"             # ProtonUp-Qt
    "com.heroicgameslauncher.hgl"       # Heroic Games Launcher
)
