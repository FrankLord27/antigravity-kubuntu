#!/usr/bin/env bash
# =============================================================================
#  ANTIGRAVITY — configs/packages.conf  [Kubuntu 26.04 LTS]
#  Driver: 580-open (producción estable Turing) | CUDA: 12.8 | Sin X11
# =============================================================================
NVIDIA_DRIVER_VERSION="580"
# Variante del driver:
#   "proprietary" → permite desactivar GSP (fix stutter Turing en KDE/juegos)
#   "open"        → fuerza firmware GSP (stutter conocido en Turing, issues #777/#693)
NVIDIA_DRIVER_VARIANT="proprietary"
# Desactivar firmware GSP — SOLO surte efecto con variante proprietary
NVIDIA_DISABLE_GSP=true
[[ "$NVIDIA_DRIVER_VARIANT" == "open" ]] && NVIDIA_PKG_SUFFIX="-open" || NVIDIA_PKG_SUFFIX=""
NVIDIA_DRIVER_PKG="nvidia-driver-${NVIDIA_DRIVER_VERSION}${NVIDIA_PKG_SUFFIX}"
NVIDIA_MIN_VERSION_ACCEPTABLE=578
NVIDIA_MAX_VERSION_STABLE=589
CUDA_VERSION="12-8"
CUDA_VERSION_PATH="12.8"
GUM_VERSION="0.14.1"
NODE_VERSION="lts"

PKGS_BASE=(
    curl wget git htop btop nano vim bash-completion unzip tar xz-utils
    p7zip-full p7zip-rar pciutils usbutils lshw hwinfo inxi neofetch fastfetch
    build-essential dkms linux-headers-generic lm-sensors fwupd
    software-properties-common apt-transport-https ca-certificates gnupg
    mokutil python3 python3-pip intel-microcode linux-firmware
)

PKGS_NVIDIA=(
    "nvidia-driver-${NVIDIA_DRIVER_VERSION}${NVIDIA_PKG_SUFFIX}"
    "nvidia-dkms-${NVIDIA_DRIVER_VERSION}${NVIDIA_PKG_SUFFIX}"
    "nvidia-utils-${NVIDIA_DRIVER_VERSION}"
    "nvidia-settings"
    "libnvidia-gl-${NVIDIA_DRIVER_VERSION}"
    "libnvidia-gl-${NVIDIA_DRIVER_VERSION}:i386"
    "libnvidia-compute-${NVIDIA_DRIVER_VERSION}"
    "libnvidia-compute-${NVIDIA_DRIVER_VERSION}:i386"
    "libnvidia-decode-${NVIDIA_DRIVER_VERSION}"
    "libnvidia-encode-${NVIDIA_DRIVER_VERSION}"
    "libnvidia-fbc1-${NVIDIA_DRIVER_VERSION}"
)

PKGS_NVIDIA_REMOVE=(
